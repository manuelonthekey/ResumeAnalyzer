<div class="min-h-screen bg-surface-50 dark:bg-surface-950 pb-12">
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 app-header px-6 h-14 flex items-center">
    <div class="flex items-center gap-3">
      <button
        (click)="goBack()"
        class="p-1.5 text-surface-400 hover:text-white transition-colors rounded"
        title="Back"
      >
        <lucide-icon [img]="ArrowLeft" [size]="18"></lucide-icon>
      </button>
      <div>
        <h1 class="text-sm font-semibold text-white">Upload Resume</h1>
        <p class="text-xs text-surface-400">PDF files up to 10 MB</p>
      </div>
    </div>
  </header>

  <div class="max-w-lg mx-auto px-4 pt-24">
    <div class="surface-card rounded-lg p-6 shadow-card border border-surface-200 dark:border-surface-700">

      <!-- Drop zone -->
      <div
        (dragover)="handleDragOver($event)"
        (dragleave)="handleDragLeave($event)"
        (drop)="handleDrop($event)"
        [class]="'border-2 border-dashed rounded-lg p-10 flex flex-col items-center justify-center transition-colors ' +
          (dragging() ? 'border-accent-400 bg-accent-50/30 dark:bg-accent-900/10' :
            (file() ? 'border-success-500 bg-success-50/20 dark:bg-success-500/5' : 'border-surface-300 dark:border-surface-700 hover:border-surface-400 dark:hover:border-surface-600 bg-surface-50 dark:bg-surface-900/30'))"
      >
        <input
          type="file"
          id="resume-file"
          accept=".pdf"
          class="hidden"
          (change)="handleFileChange($event)"
          [disabled]="loading()"
        />

        <!-- File selected state -->
        <div *ngIf="file(); else emptyState" class="flex flex-col items-center text-center">
          <div class="p-3 bg-success-50 dark:bg-success-500/10 rounded-lg mb-3">
            <lucide-icon [img]="FileText" [size]="32" class="text-success-600 dark:text-success-500"></lucide-icon>
          </div>
          <p class="font-medium text-surface-800 dark:text-surface-200 text-sm max-w-[260px] truncate">{{ file()?.name }}</p>
          <p class="text-surface-400 text-xs mt-1">{{ (file()!.size / 1024 / 1024).toFixed(2) }} MB</p>
          <button
            (click)="clearFile()"
            class="mt-3 text-xs text-surface-400 hover:text-surface-600 dark:hover:text-surface-300 underline"
            [disabled]="loading()"
          >
            Remove
          </button>
        </div>

        <ng-template #emptyState>
          <label for="resume-file" class="cursor-pointer flex flex-col items-center w-full">
            <div class="p-3 bg-surface-100 dark:bg-surface-800 rounded-lg mb-3">
              <lucide-icon [img]="Upload" [size]="28" class="text-surface-400"></lucide-icon>
            </div>
            <p class="font-medium text-surface-700 dark:text-surface-300 text-sm">Drag & drop your resume</p>
            <p class="text-surface-400 text-xs mt-1">or <span class="text-accent-600 dark:text-accent-400 underline">browse files</span></p>
          </label>
        </ng-template>
      </div>

      <!-- Error -->
      <div *ngIf="error()"
        class="mt-4 px-4 py-3 bg-danger-50 dark:bg-danger-500/10 border border-danger-100 dark:border-danger-500/20 text-danger-600 dark:text-danger-400 text-sm rounded-lg">
        {{ error() }}
      </div>

      <!-- Submit -->
      <button
        *ngIf="file()"
        (click)="handleUpload()"
        [disabled]="loading()"
        class="w-full mt-5 btn-primary py-2.5 text-sm font-medium rounded-lg disabled:opacity-50 flex items-center justify-center gap-2"
      >
        <lucide-icon *ngIf="loading()" [img]="Loader" class="animate-spin" [size]="16"></lucide-icon>
        {{ loading() ? 'Parsing resume...' : 'Process Resume' }}
      </button>

    </div>
  </div>
</div>
