<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col">
  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-40 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-3.5 flex items-center gap-3.5">
      <button 
        (click)="goBack()" 
        class="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-lg transition-colors text-slate-700 dark:text-slate-300 flex items-center justify-center cursor-pointer"
        title="Back to Dashboard"
      >
        <lucide-icon [img]="ArrowLeft" [size]="18"></lucide-icon>
      </button>
      <div>
        <h1 class="text-base font-bold text-slate-900 dark:text-slate-100 leading-tight">Upload Resume</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">PDF documents up to 10MB</p>
      </div>
    </div>
  </header>

  <!-- Upload Form Container -->
  <main class="flex-1 max-w-xl w-full mx-auto px-4 py-10">
    <div class="bg-white dark:bg-slate-900 rounded-xl p-6 sm:p-8 shadow-sm border border-slate-200 dark:border-slate-800">
      
      <!-- Drag & Drop Zone -->
      <div
        (dragover)="handleDragOver($event)"
        (dragleave)="handleDragLeave($event)"
        (drop)="handleDrop($event)"
        [class]="'border-2 border-dashed rounded-lg p-8 sm:p-10 flex flex-col items-center justify-center transition-colors text-center ' + 
          (dragging() ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/20' : 
            (file() ? 'border-emerald-400 bg-emerald-50/20 dark:bg-emerald-950/20' : 'border-slate-300 dark:border-slate-700 hover:border-slate-400 bg-slate-50/50 dark:bg-slate-950/50'))"
      >
        <input
          type="file"
          id="resume-file"
          accept=".pdf"
          class="hidden"
          (change)="handleFileChange($event)"
          [disabled]="loading()"
        />
        
        <!-- File Selected State -->
        <div *ngIf="file(); else emptyState" class="flex flex-col items-center">
          <div class="w-12 h-12 bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 rounded-lg flex items-center justify-center mb-3">
            <lucide-icon [img]="FileText" [size]="24"></lucide-icon>
          </div>
          <h4 class="font-semibold text-slate-900 dark:text-slate-100 text-sm max-w-[280px] truncate">{{ file()?.name }}</h4>
          <p class="text-slate-500 text-xs mt-1">{{ (file()!.size / 1024 / 1024).toFixed(2) }} MB</p>
          
          <button
            (click)="clearFile()"
            class="mt-3 text-xs font-medium text-blue-600 dark:text-blue-400 hover:underline cursor-pointer"
            [disabled]="loading()"
          >
            Choose a different file
          </button>
        </div>
        
        <!-- Empty Dropzone State -->
        <ng-template #emptyState>
          <label for="resume-file" class="cursor-pointer flex flex-col items-center w-full">
            <div class="w-12 h-12 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-lg flex items-center justify-center mb-3">
              <lucide-icon [img]="Upload" [size]="22"></lucide-icon>
            </div>
            <h4 class="font-semibold text-slate-800 dark:text-slate-200 text-sm">Drag & drop your resume PDF</h4>
            <p class="text-slate-500 text-xs mt-1">or browse files from your computer</p>
          </label>
        </ng-template>
      </div>

      <!-- Error Alert -->
      <div *ngIf="error()" class="mt-4 p-3 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-400 text-xs rounded-lg text-center font-medium">
        {{ error() }}
      </div>

      <!-- Action Button -->
      <button
        *ngIf="file()"
        (click)="handleUpload()"
        [disabled]="loading()"
        class="w-full mt-6 bg-slate-900 hover:bg-slate-800 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 text-sm cursor-pointer shadow-sm"
      >
        <ng-container *ngIf="loading(); else btnText">
          <lucide-icon [img]="Loader" class="animate-spin" [size]="16"></lucide-icon>
          <span>Parsing resume structure with Affinda...</span>
        </ng-container>
        <ng-template #btnText>
          <span>Upload & Analyze</span>
        </ng-template>
      </button>

      <!-- Processing indicator skeleton (Tell #28) -->
      <div *ngIf="loading()" class="mt-5 p-4 bg-slate-50 dark:bg-slate-950 rounded-lg border border-slate-200 dark:border-slate-800 space-y-2.5">
        <div class="flex items-center justify-between text-xs text-slate-500">
          <span>Extracting experience and skills...</span>
          <span class="animate-pulse font-medium text-blue-600">Processing</span>
        </div>
        <div class="h-1.5 w-full bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full bg-blue-600 rounded-full skeleton-box w-3/4"></div>
        </div>
      </div>
    </div>
  </main>
</div>
