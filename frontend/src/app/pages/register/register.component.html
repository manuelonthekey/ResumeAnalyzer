<div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-8">
    <div class="flex flex-col items-center mb-7">
      <div class="w-12 h-12 bg-slate-900 dark:bg-blue-600 rounded-lg flex items-center justify-center text-white mb-3.5 shadow-sm">
        <lucide-icon [img]="FileText" [size]="22"></lucide-icon>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">Create your account</h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Get started with ResumeFlow in seconds</p>
    </div>

    <div *ngIf="error" class="mb-5 p-3.5 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-400 text-sm rounded-lg text-center font-medium">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Full name</label>
        <div class="relative">
          <lucide-icon [img]="User" class="absolute left-3.5 top-3 text-slate-400" [size]="18"></lucide-icon>
          <input
            type="text"
            placeholder="Jane Doe"
            [(ngModel)]="name"
            name="name"
            class="w-full pl-10 pr-3.5 py-2.5 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 dark:text-slate-100 text-slate-900 text-sm transition-colors"
            required
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email address</label>
        <div class="relative">
          <lucide-icon [img]="Mail" class="absolute left-3.5 top-3 text-slate-400" [size]="18"></lucide-icon>
          <input
            type="email"
            placeholder="name@example.com"
            [(ngModel)]="email"
            name="email"
            class="w-full pl-10 pr-3.5 py-2.5 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 dark:text-slate-100 text-slate-900 text-sm transition-colors"
            required
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <lucide-icon [img]="Lock" class="absolute left-3.5 top-3 text-slate-400" [size]="18"></lucide-icon>
          <input
            type="password"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            class="w-full pl-10 pr-3.5 py-2.5 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 dark:text-slate-100 text-slate-900 text-sm transition-colors"
            required
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full mt-2 bg-slate-900 hover:bg-slate-800 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 text-sm cursor-pointer"
      >
        <span>{{ loading ? 'Creating account...' : 'Create Account' }}</span>
        <lucide-icon *ngIf="!loading" [img]="ArrowRight" [size]="16"></lucide-icon>
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
      Already have an account? 
      <a routerLink="/login" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">
        Sign in
      </a>
    </div>

    <!-- Terms of Service & Privacy Policy -->
    <div class="mt-8 pt-4 border-t border-slate-100 dark:border-slate-800 text-center text-xs text-slate-400 dark:text-slate-500 flex items-center justify-center gap-3">
      <button (click)="openLegal('terms')" class="hover:text-slate-600 dark:hover:text-slate-300 hover:underline">
        Terms of Service
      </button>
      <span>•</span>
      <button (click)="openLegal('privacy')" class="hover:text-slate-600 dark:hover:text-slate-300 hover:underline">
        Privacy Policy
      </button>
    </div>
  </div>
</div>

<app-legal-modal
  [isOpen]="legalOpen"
  [type]="legalType"
  (closeEvent)="legalOpen = false"
></app-legal-modal>
