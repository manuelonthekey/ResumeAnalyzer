<div class="min-h-screen bg-surface-50 dark:bg-surface-950 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">

    <!-- Brand -->
    <div class="mb-8 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-accent-700 rounded-lg mb-4">
        <lucide-icon [img]="FileText" [size]="22" class="text-white"></lucide-icon>
      </div>
      <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-50 tracking-tight">ResumeFlow</h1>
      <p class="text-sm text-surface-500 dark:text-surface-400 mt-1">Create your account</p>
    </div>

    <!-- Error -->
    <div *ngIf="error"
      class="mb-5 px-4 py-3 bg-danger-50 dark:bg-danger-500/10 border border-danger-100 dark:border-danger-500/20 text-danger-600 dark:text-danger-400 text-sm rounded-lg">
      {{ error }}
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1.5">Full name</label>
        <input
          type="text"
          placeholder="Jane Smith"
          [(ngModel)]="name"
          name="name"
          class="w-full px-3 py-2.5 text-sm bg-white dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent text-surface-900 dark:text-surface-100 placeholder:text-surface-400"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1.5">Email</label>
        <input
          type="email"
          placeholder="you@example.com"
          [(ngModel)]="email"
          name="email"
          class="w-full px-3 py-2.5 text-sm bg-white dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent text-surface-900 dark:text-surface-100 placeholder:text-surface-400"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-1.5">Password</label>
        <input
          type="password"
          placeholder="At least 8 characters"
          [(ngModel)]="password"
          name="password"
          class="w-full px-3 py-2.5 text-sm bg-white dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent text-surface-900 dark:text-surface-100 placeholder:text-surface-400"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full btn-primary py-2.5 text-sm font-medium rounded-lg disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
      >
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-surface-500 dark:text-surface-400">
      Already have an account?
      <a routerLink="/login" class="text-accent-600 dark:text-accent-400 font-medium hover:underline ml-1">
        Sign in
      </a>
    </p>

    <!-- Legal footer -->
    <div class="mt-8 pt-6 border-t border-surface-200 dark:border-surface-800 text-center">
      <p class="text-xs text-surface-400">
        By creating an account you agree to our
        <a routerLink="/terms" class="underline hover:text-surface-600">Terms of Service</a>
        and
        <a routerLink="/privacy" class="underline hover:text-surface-600">Privacy Policy</a>
      </p>
    </div>

  </div>
</div>
