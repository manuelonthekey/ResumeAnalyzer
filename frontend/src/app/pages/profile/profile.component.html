<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col">
  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-40 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3.5 flex items-center gap-3.5">
      <button 
        (click)="goBack()" 
        class="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-lg transition-colors text-slate-700 dark:text-slate-300 flex items-center justify-center cursor-pointer"
        title="Back to Dashboard"
      >
        <lucide-icon [img]="ArrowLeft" [size]="18"></lucide-icon>
      </button>
      <div>
        <h1 class="text-base font-bold text-slate-900 dark:text-slate-100 leading-tight">Profile Settings</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Manage your profile, target roles, and links</p>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 py-8">
    <!-- Skeleton Loading State (Tell #28) -->
    <div *ngIf="isLoading()" class="space-y-6">
      <div class="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 flex items-center gap-5">
        <div class="w-20 h-20 rounded-full skeleton-box shrink-0"></div>
        <div class="space-y-2 flex-1">
          <div class="h-5 w-40 rounded skeleton-box"></div>
          <div class="h-3 w-56 rounded skeleton-box"></div>
        </div>
      </div>
      <div class="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 space-y-4">
        <div class="h-4 w-32 rounded skeleton-box"></div>
        <div class="h-10 w-full rounded skeleton-box"></div>
        <div class="h-10 w-full rounded skeleton-box"></div>
      </div>
    </div>

    <!-- Loaded Profile Form -->
    <form *ngIf="!isLoading()" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Profile Picture Card -->
      <div class="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col sm:flex-row items-center gap-6">
        <div class="relative shrink-0">
          <div class="w-20 h-20 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 flex items-center justify-center shadow-sm">
            <img *ngIf="formData.profile_picture; else noPic" [src]="formData.profile_picture" alt="Avatar" class="w-full h-full object-cover" />
            <ng-template #noPic>
              <lucide-icon [img]="User" [size]="32" class="text-slate-400"></lucide-icon>
            </ng-template>
          </div>
          <label class="absolute -bottom-1 -right-1 p-1.5 bg-slate-900 dark:bg-blue-600 text-white rounded-full cursor-pointer hover:bg-slate-800 transition-colors shadow-sm" title="Upload Photo">
            <lucide-icon [img]="Upload" [size]="14"></lucide-icon>
            <input type="file" accept="image/*" class="hidden" (change)="handleImageUpload($event)" />
          </label>
        </div>
        <div class="text-center sm:text-left">
          <h3 class="text-base font-bold text-slate-900 dark:text-slate-100">{{ formData.name || 'User Profile' }}</h3>
          <p class="text-slate-500 text-xs flex items-center gap-1.5 justify-center sm:justify-start mt-0.5">
            <lucide-icon [img]="Mail" [size]="13"></lucide-icon> {{ profileEmail }}
          </p>
          <p class="text-[11px] text-slate-400 mt-1.5">PNG or JPG under 2MB</p>
        </div>
      </div>

      <!-- Personal Details -->
      <div class="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 border-b border-slate-100 dark:border-slate-800 pb-2">Personal Details</h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Full Name</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <lucide-icon [img]="User" [size]="16"></lucide-icon>
              </span>
              <input
                type="text"
                required
                name="name"
                [(ngModel)]="formData.name"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-slate-800 dark:text-slate-200 text-xs transition-colors"
              />
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Target Roles</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <lucide-icon [img]="Briefcase" [size]="16"></lucide-icon>
              </span>
              <input
                type="text"
                name="preferred_roles"
                placeholder="e.g. Software Engineer, Tech Lead"
                [(ngModel)]="formData.preferred_roles"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-slate-800 dark:text-slate-200 text-xs transition-colors"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Professional Links -->
      <div class="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 border-b border-slate-100 dark:border-slate-800 pb-2">Professional Links</h3>

        <div class="space-y-3.5">
          <div>
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">LinkedIn URL</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <lucide-icon [img]="Linkedin" [size]="16"></lucide-icon>
              </span>
              <input
                type="url"
                name="linkedin_url"
                placeholder="https://linkedin.com/in/username"
                [(ngModel)]="formData.linkedin_url"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-slate-800 dark:text-slate-200 text-xs transition-colors"
              />
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">GitHub URL</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <lucide-icon [img]="Github" [size]="16"></lucide-icon>
              </span>
              <input
                type="url"
                name="github_url"
                placeholder="https://github.com/username"
                [(ngModel)]="formData.github_url"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-slate-800 dark:text-slate-200 text-xs transition-colors"
              />
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Portfolio or Personal Website</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <lucide-icon [img]="Globe" [size]="16"></lucide-icon>
              </span>
              <input
                type="url"
                name="portfolio_url"
                placeholder="https://yourportfolio.com"
                [(ngModel)]="formData.portfolio_url"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-slate-800 dark:text-slate-200 text-xs transition-colors"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isSaving()"
        class="w-full bg-slate-900 hover:bg-slate-800 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 text-xs cursor-pointer shadow-sm"
      >
        <ng-container *ngIf="isSaving(); else saveBtn">
          <lucide-icon [img]="Loader" class="animate-spin" [size]="14"></lucide-icon>
          <span>Saving Changes...</span>
        </ng-container>
        <ng-template #saveBtn>
          <lucide-icon [img]="Check" [size]="14"></lucide-icon>
          <span>Save Changes</span>
        </ng-template>
      </button>
    </form>
  </main>
</div>
