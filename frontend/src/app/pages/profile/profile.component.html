<div *ngIf="isLoading()" class="min-h-screen bg-surface-50 dark:bg-surface-950 flex items-center justify-center">
  <lucide-icon [img]="Loader" class="animate-spin text-surface-400" [size]="24"></lucide-icon>
</div>

<div *ngIf="!isLoading()" class="min-h-screen bg-surface-50 dark:bg-surface-950 pb-12">
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 app-header px-6 h-14 flex items-center">
    <div class="flex items-center gap-3">
      <button (click)="goBack()" class="p-1.5 text-surface-400 hover:text-white transition-colors rounded" title="Back">
        <lucide-icon [img]="ArrowLeft" [size]="18"></lucide-icon>
      </button>
      <div>
        <h1 class="text-sm font-semibold text-white">Profile Settings</h1>
        <p class="text-xs text-surface-400">Career profile, roles, and socials</p>
      </div>
    </div>
  </header>

  <div class="max-w-2xl mx-auto px-4 pt-20">
    <form (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Avatar card -->
      <div class="surface-card rounded-lg p-5 shadow-card border border-surface-200 dark:border-surface-700 flex flex-col sm:flex-row items-center gap-5">
        <div class="relative shrink-0">
          <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-surface-200 dark:border-surface-700 bg-surface-100 dark:bg-surface-800 flex items-center justify-center">
            <img *ngIf="formData.profile_picture; else noPic" [src]="formData.profile_picture" alt="Avatar" class="w-full h-full object-cover" />
            <ng-template #noPic>
              <lucide-icon [img]="User" [size]="36" class="text-surface-300 dark:text-surface-600"></lucide-icon>
            </ng-template>
          </div>
          <label class="absolute bottom-0 right-0 p-1.5 bg-accent-700 hover:bg-accent-800 text-white rounded-full cursor-pointer transition-colors shadow-sm">
            <lucide-icon [img]="Upload" [size]="12"></lucide-icon>
            <input type="file" accept="image/*" class="hidden" (change)="handleImageUpload($event)" />
          </label>
        </div>
        <div class="text-center sm:text-left">
          <h3 class="text-base font-semibold text-surface-900 dark:text-surface-100">{{ formData.name || 'Your Name' }}</h3>
          <p class="text-sm text-surface-400 flex items-center gap-1 justify-center sm:justify-start mt-0.5">
            <lucide-icon [img]="Mail" [size]="13"></lucide-icon>
            {{ profileEmail }}
          </p>
          <p class="text-xs text-surface-400 mt-1.5">PNG or JPG, max 2 MB</p>
        </div>
      </div>

      <!-- Personal details -->
      <div class="surface-card rounded-lg p-5 shadow-card border border-surface-200 dark:border-surface-700">
        <h3 class="text-sm font-semibold text-surface-900 dark:text-surface-100 mb-4 pb-2 border-b border-surface-100 dark:border-surface-700">Personal Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-surface-500 dark:text-surface-400 mb-1.5 uppercase tracking-wider">Full Name</label>
            <input
              type="text"
              required
              name="name"
              [(ngModel)]="formData.name"
              class="w-full px-3 py-2.5 text-sm bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500 text-surface-800 dark:text-surface-200"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-surface-500 dark:text-surface-400 mb-1.5 uppercase tracking-wider">Preferred Job Roles</label>
            <input
              type="text"
              name="preferred_roles"
              placeholder="e.g. Frontend Engineer, PM"
              [(ngModel)]="formData.preferred_roles"
              class="w-full px-3 py-2.5 text-sm bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500 text-surface-800 dark:text-surface-200 placeholder:text-surface-400"
            />
          </div>
        </div>
      </div>

      <!-- Professional links -->
      <div class="surface-card rounded-lg p-5 shadow-card border border-surface-200 dark:border-surface-700">
        <h3 class="text-sm font-semibold text-surface-900 dark:text-surface-100 mb-4 pb-2 border-b border-surface-100 dark:border-surface-700">Professional Links</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-surface-500 dark:text-surface-400 mb-1.5 uppercase tracking-wider">LinkedIn</label>
            <input
              type="url"
              name="linkedin_url"
              placeholder="https://linkedin.com/in/username"
              [(ngModel)]="formData.linkedin_url"
              class="w-full px-3 py-2.5 text-sm bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500 text-surface-800 dark:text-surface-200 placeholder:text-surface-400"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-surface-500 dark:text-surface-400 mb-1.5 uppercase tracking-wider">GitHub</label>
            <input
              type="url"
              name="github_url"
              placeholder="https://github.com/username"
              [(ngModel)]="formData.github_url"
              class="w-full px-3 py-2.5 text-sm bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500 text-surface-800 dark:text-surface-200 placeholder:text-surface-400"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-surface-500 dark:text-surface-400 mb-1.5 uppercase tracking-wider">Portfolio / Website</label>
            <input
              type="url"
              name="portfolio_url"
              placeholder="https://yoursite.com"
              [(ngModel)]="formData.portfolio_url"
              class="w-full px-3 py-2.5 text-sm bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-500 text-surface-800 dark:text-surface-200 placeholder:text-surface-400"
            />
          </div>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isSaving()"
        class="w-full btn-primary py-2.5 text-sm font-medium rounded-lg disabled:opacity-50 flex items-center justify-center gap-2"
      >
        <lucide-icon *ngIf="isSaving()" [img]="Loader" class="animate-spin" [size]="15"></lucide-icon>
        {{ isSaving() ? 'Saving...' : 'Save Changes' }}
      </button>

    </form>
  </div>
</div>
